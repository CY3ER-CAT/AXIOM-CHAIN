# axiom multi-hop chain — VPN (if up) -> Tor -> rotating SOCKS
strict_chain
proxy_dns
remote_dns_subnet 224.0.0.0
tcp_read_time_out 15000
tcp_connect_time_out 8000
quiet_mode

[ProxyList]
# Hop 1 — local VPN gateway (wg0/if up), auto-skipped by axiom-multihop if down
#socks5 127.0.0.1 1080

# Hop 2 — local Tor (already running on this box, boss man)
socks5 127.0.0.1 9050

# Hop 3 — rotate in provider SOCKS here when you got 'em
#socks5 127.0.0.1 1081
